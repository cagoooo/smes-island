name: 同步校園公告

on:
  schedule:
    # 台灣時間 07:03～19:53 每 10 分鐘一次（cron 用 UTC）
    # GitHub 尖峰時會丟棄排程，實際約數小時才跑一次，時段排密一點提高機會
    - cron: '3,13,23,33,43,53 23,0-11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-news.mjs /tmp/news.json
      - run: node scripts/fetch-alert.mjs /tmp/alert.json
        continue-on-error: true
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
      - name: 寫入 live-data 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin live-data 2>/dev/null; then
            git checkout -B live-data FETCH_HEAD
          else
            git checkout --orphan live-data
            git rm -rf . >/dev/null
          fi
          # 只比對內容，時間戳記改變不算更新；有警報或停班停課期間每次都寫入，讓網站知道資料還是新的
          changed=0
          same() { [ -f "$2" ] && [ "$(node -p "JSON.stringify(require('./$2').$3)")" = "$(node -p "JSON.stringify(require('$1').$3)")" ]; }
          if ! same /tmp/news.json news.json items; then
            cp /tmp/news.json news.json
            git add news.json
            changed=1
          fi
          if [ -f /tmp/alert.json ]; then
            if ! same /tmp/alert.json alert.json info || ! same /tmp/alert.json alert.json warning || [ "$(node -p "const a = require('/tmp/alert.json'); a.info || a.warning ? 1 : 0")" = 1 ]; then
              cp /tmp/alert.json alert.json
              git add alert.json
              changed=1
            fi
          fi
          if [ "$changed" = 0 ]; then
            echo "公告沒有變化"
            exit 0
          fi
          git commit -m "chore: 同步校園公告與停班停課資訊"
          git push origin live-data
